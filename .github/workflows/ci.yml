# Continuous integration for the Python / Flask app.
# Runs lint, security checks, and tests on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a mutable tag, so a compromised
      # action release cannot silently run in this pipeline.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project deps if a requirements file exists yet.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Tooling used by the steps below.
          pip install ruff pip-audit pytest

      - name: Lint
        run: ruff check .

      - name: Dependency vulnerability scan
        # Fails the build if a dependency has a known published CVE.
        run: pip-audit

      - name: Tests
        run: pytest
