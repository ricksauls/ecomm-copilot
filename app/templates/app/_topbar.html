{# Topbar: breadcrumb (per screen), a product/brand search, and the Client View
   toggle. Search and the toggle are presentational in this pass; wire them to
   real behavior later. #}
<div class="topbar">
  <div class="breadcrumb">{{ breadcrumb }}</div>
  <div class="topbar-spacer"></div>
  <div class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke="#8c8c8c" stroke-width="1.3" aria-hidden="true">
      <circle cx="7" cy="7" r="4.5" /><path d="M11 11l3 3" />
    </svg>
    <span>Search products, brands</span>
  </div>
  <button type="button" class="client-toggle">
    {{ "Exit client view" if client_mode else "Client view" }}
  </button>
</div>
