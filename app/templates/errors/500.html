{% extends "public_base.html" %}
{% block title %}Something went wrong — ecomm-copilot{% endblock %}
{% block content %}
<div style="max-width: 520px; margin: 120px auto; padding: 0 40px;">
  <p class="label" style="font-size: 10px; letter-spacing: 0.12em;">Error</p>
  <hr class="red-rule" style="margin: 12px 0 20px;" />
  <h1 style="font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0;">
    Something went wrong on our end.
  </h1>
  <p style="font-size: 14px; color: var(--cool-gray); margin: 16px 0 28px;">
    The issue has been logged. Try again in a moment.
  </p>
  <a href="{{ url_for('pages.landing') }}" class="btn btn-primary">Back to home</a>
</div>
{% endblock %}
