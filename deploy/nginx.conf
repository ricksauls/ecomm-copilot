# nginx reverse proxy for ecomm-copilot.
#
# Install on the droplet at /etc/nginx/sites-available/ecomm-copilot, symlink it
# into sites-enabled, test, and reload:
#   sudo ln -s /etc/nginx/sites-available/ecomm-copilot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the plain-HTTP (port 80) starting point. Once the ecomm-copilot.com
# A records point at this droplet, run:
#   sudo certbot --nginx -d ecomm-copilot.com -d www.ecomm-copilot.com
# which rewrites this file in place to add the TLS server block on 443 and an
# HTTP->HTTPS redirect. Do not serve the app over plain HTTP long-term — TLS is
# what makes the app's Secure session cookies meaningful.

server {
    listen 80;
    listen [::]:80;
    server_name ecomm-copilot.com www.ecomm-copilot.com;

    # Serve static assets directly from nginx rather than through gunicorn —
    # faster, and it frees Python workers for real requests. Path must match the
    # app's static folder on disk.
    location /static/ {
        alias /home/deploy/apps/ecomm-copilot/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        # Port 8001: 8000/8002 are used by other apps on this shared droplet.
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lets Flask know the original scheme so it can set Secure cookies and
        # build correct absolute URLs once TLS is terminated here at nginx.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Don't advertise the nginx version in error pages / headers.
    server_tokens off;
}
