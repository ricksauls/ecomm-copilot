# nginx reverse proxy for ecomm-copilot.
#
# Install on the droplet at /etc/nginx/sites-available/ecomm-copilot, symlink it
# into sites-enabled, test, and reload:
#   sudo ln -s /etc/nginx/sites-available/ecomm-copilot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace `your-domain.example` below with the real hostname BEFORE running
# certbot. This file is the plain-HTTP (port 80) starting point; running
#   sudo certbot --nginx -d your-domain.example
# rewrites it in place to add the TLS server block on 443 and an HTTP->HTTPS
# redirect. Do not serve the app over plain HTTP in production once a cert is
# available — TLS is what makes the app's Secure session cookies meaningful.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Serve static assets directly from nginx rather than proxying them through
    # gunicorn — faster, and it frees Python workers for real requests. Path
    # must match the app's static folder on disk.
    location /static/ {
        alias /opt/ecomm-copilot/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lets Flask know the original scheme so it can set Secure cookies and
        # build correct absolute URLs once TLS is terminated here at nginx.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Don't advertise the nginx version in error pages / headers.
    server_tokens off;
}
